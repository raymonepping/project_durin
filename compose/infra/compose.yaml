services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: arcanium-postgres
    hostname: postgres
    user: "70:70"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [default]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  adminer:
    image: docker.io/library/adminer:latest
    container_name: arcanium-adminer
    hostname: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:8080"
    networks: [default]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: arcanium-control
    external: true

volumes:
  postgres-data: {}
