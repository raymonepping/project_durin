# compose/infra/compose.yaml — PostgreSQL for Durin
#
# PostgreSQL is the visible, inspectable database that stores:
#   - customer metadata (plaintext)
#   - protected field values (ciphertext — vault:vX:...)
#   - document metadata (plaintext) + encrypted payloads (ciphertext)
#   - audit events
#   - break glass requests
#
# The Database Inspector in the Durin frontend reads directly from this
# database to show the ciphertext representation alongside the application
# representation. That visibility is intentional and central to the demo.
#
# Adminer provides a direct SQL view — useful for demonstrating that the
# database holds vault:vX:... ciphertext, not plaintext sensitive values.

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: durin-postgres
    hostname: postgres
    user: "70:70"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [default]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Adminer: direct SQL access — useful for the Database Inspector demo to
  # show ciphertext values at the raw database layer.
  adminer:
    image: docker.io/library/adminer:latest
    container_name: durin-adminer
    hostname: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:8080"
    networks: [default]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: durin-internal
    external: true

volumes:
  postgres-data: {}
