# Agents A, B, C, D — four separate containers from one shared image,
# differentiated by AGENT_IDENTITY. See
# prompts/agents/01_01_agent_runtime_framework.md.
#
# Each service's environment carries ONLY its own agent's bearer token —
# never all four — matching this prompt's own containment rule ("no
# agent container has ... any credential beyond its own per-agent bearer
# token"). No host filesystem mount, no ~/.ssh|~/.aws|~/.kube, no Podman
# socket, no outbound network beyond factory-control (agents never reach
# Vault or PostgreSQL directly — even Agent C's database mutations are
# executed inside factory-api using Agent C's leased credential, not
# from agent-c's own container; see security/authority-model.md's "no
# agent container ever holds a Vault credential").

networks:
  default:
    name: factory-control
    external: true

x-agent-common: &agent-common
  build:
    context: ../../agents
    dockerfile: Containerfile
  image: factory-agent:local
  restart: unless-stopped
  # Wave 5 hardening (prompts/improvements/01_01_improvement.md) — same
  # pattern already proven for compose/vault/compose.yaml's vault-agent
  # service. The node:22-alpine image's own `node` user is UID/GID
  # 1000:1000 (confirmed live); the only local write an agent runtime
  # ever does is agents/src/heartbeat.js's /tmp/agent-heartbeat touch, so
  # /tmp is the only tmpfs path required — smoke-tested read-only with
  # just that path before applying here.
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]
  environment: &agent-common-env
    OLLAMA_MODEL: "${OLLAMA_MODEL}"
    AGENT_MAX_ITERATIONS: "${AGENT_MAX_ITERATIONS:-15}"
    AGENT_TASK_TIMEOUT_MS: "${AGENT_TASK_TIMEOUT_MS:-300000}"
  healthcheck:
    test: ["CMD-SHELL", "node -e \"const fs=require('fs');const t=fs.statSync('/tmp/agent-heartbeat').mtimeMs;process.exit(Date.now()-t<60000?0:1)\" || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  agent-a:
    <<: *agent-common
    container_name: factory-agent-a
    hostname: agent-a
    environment:
      <<: *agent-common-env
      AGENT_IDENTITY: agent-a
      AGENT_A_TOKEN: "${AGENT_A_TOKEN}"

  agent-b:
    <<: *agent-common
    container_name: factory-agent-b
    hostname: agent-b
    environment:
      <<: *agent-common-env
      AGENT_IDENTITY: agent-b
      AGENT_B_TOKEN: "${AGENT_B_TOKEN}"

  agent-c:
    <<: *agent-common
    container_name: factory-agent-c
    hostname: agent-c
    environment:
      <<: *agent-common-env
      AGENT_IDENTITY: agent-c
      AGENT_C_TOKEN: "${AGENT_C_TOKEN}"

  agent-d:
    <<: *agent-common
    container_name: factory-agent-d
    hostname: agent-d
    environment:
      <<: *agent-common-env
      AGENT_IDENTITY: agent-d
      AGENT_D_TOKEN: "${AGENT_D_TOKEN}"
