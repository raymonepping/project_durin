# compose/observability/compose.yaml — Durin observability stack
#
# Prometheus + Grafana + OTel Collector for Vault cluster metrics,
# Transit operation counts, and scenario telemetry.
#
# Grafana is on host port 3010 (Durin frontend owns 3000).
# Prometheus scrapes all Vault nodes and the durin-backend API.

services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: durin-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/vault-token:/etc/prometheus/vault-token:ro
      - ../../vault-tls/ca-chain.pem:/etc/prometheus/vault-ca.pem:ro
      - prometheus-data:/prometheus
    networks: [durin-internal]
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: durin-grafana
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [durin-internal]
    depends_on: [prometheus]
    restart: unless-stopped

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:latest
    container_name: durin-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    networks: [durin-internal]
    restart: unless-stopped

networks:
  durin-internal:
    name: durin-internal
    external: true

volumes:
  prometheus-data: {}
  grafana-data: {}
