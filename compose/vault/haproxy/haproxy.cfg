# compose/vault/haproxy/haproxy.cfg — single HA endpoint for the Durin Vault cluster
#
# Clients (durin-backend, durin-vault-agent, vault-rotator, host tooling) talk
# to https://vault-lb:8200 (host: https://127.0.0.1:18300) instead of one node.
#
# TCP passthrough: TLS is terminated by Vault, not here. Clients keep verifying
# Vault's certificate (SAN vault-lb) against the Durin CA, and the load balancer
# never sees tokens, ciphertext or plaintext.
#
# Leader-only routing (pattern from vault_reference :8210): GET /v1/sys/health
# without standbyok/perfstandbyok returns 200 only on the active node (standby
# 429, perf-standby 473, sealed 503), so 100% of traffic goes to the leader.
# Durin mints short-lived scoped tokens; spreading one client's requests over
# eventually-consistent perf standbys could briefly see a fresh token as
# "not found". On failover the new leader starts passing within ~4 s.
#
# No node passes → HAProxy refuses the connection → backend answers 503.
# Fail closed; never a plaintext fallback.

global
    log stdout format raw local0
    maxconn 4096

# Re-resolve node names at runtime via the Podman network DNS. Without this,
# HAProxy resolves once at start: a node that is down at boot would prevent
# startup, and a force-recreated node (new IP) would stay "down" forever.
resolvers podman
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold nx         5s

defaults
    log     global
    mode    tcp
    option  tcplog
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout check   3s

frontend vault_api
    bind *:8200
    default_backend vault_active

backend vault_active
    mode tcp
    balance first
    option httpchk GET /v1/sys/health
    http-check expect status 200
    # check-ssl + verify required: the health check itself proves the node
    # presents a certificate issued by the Durin CA for its own name.
    # on-marked-down shutdown-sessions: when the leader fails, cut keep-alive
    # sessions so clients reconnect to the new leader immediately.
    default-server check check-ssl verify required ca-file /usr/local/etc/haproxy/tls/ca-chain.pem inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers podman init-addr last,libc,none
    server vault-1 vault-1:8200 check-sni vault-1 verifyhost vault-1
    server vault-2 vault-2:8200 check-sni vault-2 verifyhost vault-2
    server vault-3 vault-3:8200 check-sni vault-3 verifyhost vault-3

# Read-only statistics. Published on 127.0.0.1 only; no admin socket.
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }
