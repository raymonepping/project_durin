# Prompt 18 — Identity stack: OpenLDAP (identity store) + Keycloak (OIDC broker).
#
# Adapted from workshop/zero_trust and Personal/vault_reference — NOT copied
# verbatim (see prompts/18_security_foundation.md "Feasibility note"):
#   - fresh, Arcanium-specific LDAP fixture (no real personal data)
#   - Keycloak issues ONE confidential client only — no public/SPA client
#   - dual-hostname Keycloak config (public vs internal) instead of relying
#     on host.docker.internal, which is Docker-Desktop-specific and not
#     assumed to behave identically under this Podman machine
#
# Arcanium's own API (arcanium-api) is the OIDC client. It reaches Keycloak
# over the shared arcanium-control network using the container DNS name
# (http://keycloak:8080) for every server-to-server call — token exchange,
# JWKS fetch, userinfo, end-session. Only the browser-facing authorization
# redirect uses the published host port (KC_HOSTNAME), because the browser
# runs on the host, outside every container network.
services:
  openldap:
    image: docker.io/osixia/openldap:1.5.0
    container_name: arcanium-openldap
    hostname: openldap
    environment:
      LDAP_ORGANISATION: "Arcanium"
      LDAP_DOMAIN: "arcanium.local"
      LDAP_BASE_DN: "dc=arcanium,dc=local"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_TLS: "false"
    cap_drop: [ALL]
    # KILL is required by osixia/openldap's own startup sequence (it starts
    # a temporary slapd, then signals it to stop before the real one takes
    # over) — found by actually running this, not assumed; without it the
    # entrypoint fails with "kill: Operation not permitted" on every start.
    cap_add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks: [arcanium-control]
    restart: unless-stopped
    healthcheck:
      # Found by actually running this: osixia/openldap restricts anonymous
      # bind by default (ACL), so an unauthenticated search returns "no such
      # object" (32) even once the base DN genuinely exists and is fully
      # populated — it's hiding existence from an unauthenticated caller,
      # not reporting an empty tree. An anonymous healthcheck can never pass.
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-D", "cn=admin,dc=arcanium,dc=local", "-w", "${LDAP_ADMIN_PASSWORD}", "-b", "dc=arcanium,dc=local", "-s", "base"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: loads compose/identity/ldap/bootstrap.ldif. Idempotent — safe to
  # re-run (setup_ldap.sh checks each entry before adding it). Never runs on a
  # plain `up`; only via `--profile init` (see `make identity-bootstrap`).
  ldap-bootstrap:
    image: docker.io/osixia/openldap:1.5.0
    container_name: arcanium-ldap-bootstrap
    profiles: ["init"]
    environment:
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_BASE_DN: "dc=arcanium,dc=local"
      LDAP_HOST: "openldap"
    entrypoint: ["/bootstrap/setup_ldap.sh"]
    volumes:
      - ./ldap:/bootstrap:ro
    networks: [arcanium-control]
    depends_on:
      openldap:
        condition: service_healthy

  ldap-admin:
    image: docker.io/osixia/phpldapadmin:0.9.0
    container_name: arcanium-ldap-admin
    hostname: ldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    cap_drop: [ALL]
    # Same osixia s6-overlay startup pattern as openldap above — needs KILL
    # for the same reason (found by running it, not assumed).
    cap_add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8084:80"
    networks: [arcanium-control]
    depends_on:
      openldap:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: docker.io/keycloak/keycloak:26.6.4
    container_name: arcanium-keycloak
    hostname: keycloak
    # No --import-realm: the realm is created idempotently by
    # keycloak-bootstrap's kcadm script, not from a mounted realm file.
    # start-dev stores its H2 database under /opt/keycloak/data — mounting
    # a named volume there makes the realm, client, and LDAP federation
    # survive container restarts and podman machine stop/start cycles.
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HTTP_ENABLED: "true"
      # Public/browser-facing hostname only — this is what Keycloak stamps
      # into the `iss` claim and the endpoints it hands back to the browser.
      # Arcanium's server-side OIDC calls do NOT use this; they go straight
      # to http://keycloak:8080 over arcanium-control. See
      # ARCANIUM_OIDC_ISSUER / ARCANIUM_OIDC_INTERNAL_URL /
      # ARCANIUM_OIDC_PUBLIC_URL in compose/arcanium/compose.yaml.
      KC_HOSTNAME: "${KC_HOSTNAME:-localhost:8083}"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks: [arcanium-control]
    depends_on:
      openldap:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # /health/ready lives on the separate management port (9000 by
      # default) which this compose file doesn't publish — found by actually
      # checking, not assumed from the docs. The realm's own well-known
      # config on the main port is a simpler, equally valid liveness/
      # readiness signal and doesn't need wget/curl inside this minimal image.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # One-shot: realm + LDAP federation + confidential client + group mapper.
  # Idempotent (setup_keycloak.sh checks-then-creates every resource).
  keycloak-bootstrap:
    image: docker.io/keycloak/keycloak:26.6.4
    container_name: arcanium-keycloak-bootstrap
    profiles: ["init"]
    entrypoint: ["/bin/bash", "/bootstrap/setup_keycloak.sh"]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      KC_INTERNAL_URL: "http://keycloak:8080"
    volumes:
      - ./keycloak:/bootstrap:ro
    networks: [arcanium-control]
    depends_on:
      keycloak:
        condition: service_healthy

networks:
  arcanium-control:
    name: arcanium-control
    external: true

volumes:
  ldap-data: {}
  ldap-config: {}
  keycloak-data: {}
