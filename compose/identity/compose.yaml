# compose/identity/compose.yaml — Durin Identity Stack
#
# OpenLDAP (identity store) + Keycloak (OIDC broker).
# prompts/security/17_01 (topology from Arcanium) + 17_02 (completion).
#
#   realm    durin        clients  durin-backend (Web Console), durin-cli (lab tests)
#   roles    durin-viewer, durin-operator, durin-security-admin  (LDAP groups → realm roles)
#   users    raymon, barend, security-admin, viewer
#   tenants  durin_tenants claim from LDAP businessCategory
#
# Secrets (pattern from Editors Factory): every password lives in Vault KV
# (secret/durin/identity/*). identity-secrets-init logs in once with AppRole
# durin-identity-secrets through vault-lb, renders the values onto the
# identity-secrets volume and revokes its token. Nothing here reads .env for a
# secret. Seed/rotate with scripts/identity-secrets.sh.
#
# The Durin backend reaches Keycloak over durin-internal (http://keycloak:8080)
# for JWKS; browsers use the published port (http://localhost:8083).

services:
  identity-secrets-init:
    image: docker.io/hashicorp/vault-enterprise:2.1.0-ent
    container_name: durin-identity-secrets-init
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    environment:
      VAULT_ADDR: "https://vault-lb:8200"
      VAULT_CACERT: "/vault/tls/ca-chain.pem"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - ./identity-secrets/entrypoint.sh:/init/entrypoint.sh:ro
      # Only the two AppRole files — never the whole .secrets/vault directory
      # (it also holds the cluster root token).
      - ../../.secrets/vault/identity-role-id:/approle/identity-role-id:ro
      - ../../.secrets/vault/identity-secret-id:/approle/identity-secret-id:ro
      - identity-secrets:/run/secrets
    networks: [durin-internal]
    restart: "no"

  openldap:
    image: docker.io/osixia/openldap:1.5.0
    container_name: durin-openldap
    hostname: openldap
    environment:
      LDAP_ORGANISATION: "Durin"
      LDAP_DOMAIN: "durin.local"
      LDAP_BASE_DN: "dc=durin,dc=local"
      LDAP_ADMIN_PASSWORD_FILE: "/run/secrets/ldap-admin-password"
      LDAP_TLS: "false"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - identity-secrets:/run/secrets:ro
    networks: [durin-internal]
    restart: unless-stopped
    depends_on:
      identity-secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D cn=admin,dc=durin,dc=local -w \"$$(cat /run/secrets/ldap-admin-password)\" -b dc=durin,dc=local -s base >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: loads bootstrap.ldif and sets user passwords from Vault KV.
  # Only runs via `--profile init` (make identity-bootstrap).
  ldap-bootstrap:
    image: docker.io/osixia/openldap:1.5.0
    container_name: durin-ldap-bootstrap
    profiles: ["init"]
    environment:
      LDAP_BASE_DN: "dc=durin,dc=local"
      LDAP_HOST: "openldap"
    entrypoint: ["/bootstrap/setup_ldap.sh"]
    volumes:
      - ./ldap:/bootstrap:ro
      - identity-secrets:/run/secrets:ro
    networks: [durin-internal]
    depends_on:
      openldap:
        condition: service_healthy

  ldap-admin:
    image: docker.io/osixia/phpldapadmin:0.9.0
    container_name: durin-ldap-admin
    hostname: ldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8084:80"
    networks: [durin-internal]
    depends_on:
      openldap:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: docker.io/keycloak/keycloak:26.6.4
    container_name: durin-keycloak
    hostname: keycloak
    # Exports the Vault-sourced bootstrap admin password, then execs kc.sh.
    entrypoint: ["/bin/sh", "/vault/vault-entrypoint.sh"]
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "${KC_HOSTNAME:-http://localhost:8083}"
      # Browser-facing issuer is fixed; internal callers (backend JWKS, kcadm) use keycloak:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: "xforwarded"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/vault-entrypoint.sh:/vault/vault-entrypoint.sh:ro
      - identity-secrets:/run/secrets:ro
    networks: [durin-internal]
    depends_on:
      openldap:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # One-shot: realm, LDAP federation + mappers, clients, claims.
  # Only runs via `--profile init` (make identity-bootstrap).
  keycloak-bootstrap:
    image: docker.io/keycloak/keycloak:26.6.4
    container_name: durin-keycloak-bootstrap
    profiles: ["init"]
    entrypoint: ["/bin/bash", "/bootstrap/setup_keycloak.sh"]
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KC_INTERNAL_URL: "http://keycloak:8080"
    volumes:
      - ./keycloak:/bootstrap:ro
      - identity-secrets:/run/secrets:ro
    networks: [durin-internal]
    depends_on:
      keycloak:
        condition: service_healthy
      ldap-bootstrap:
        condition: service_completed_successfully

networks:
  durin-internal:
    name: durin-internal
    external: true

volumes:
  ldap-data: {}
  ldap-config: {}
  keycloak-data: {}
  identity-secrets: {}
